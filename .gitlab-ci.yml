# GitLab CI/CD для публикации NPM пакетов
# Публикация происходит только при пуше тега v* и если NPM_TOKEN настроен
#
# Селективная публикация:
# - Каждый пакет публикуется только если его версия ещё не в registry
# - Используй Changesets для управления версиями: npx changeset
#
# Порядок публикации (по графу зависимостей):
# infrastructure → cli → core → search → yandex-tracker, yandex-wiki

stages:
  - validate
  - publish

variables:
  NODE_VERSION: "22"

# Общий шаблон для Node.js jobs
.node_template: &node_template
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .turbo/

# =============================================================================
# ВАЛИДАЦИЯ (запускается на всех ветках и тегах)
# =============================================================================

validate:
  <<: *node_template
  stage: validate
  script:
    - npm ci

    # Полная валидация через Turborepo (build → lint → typecheck → test)
    - npm run build
    - npm run lint:quiet
    - npm run typecheck
    - npm run test:quiet

    # Smoke tests для серверов
    - npm run test:smoke

    # Проверка дублирования кода
    - npm run cpd:quiet
  rules:
    # Запускать на merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Запускать на тегах
    - if: $CI_COMMIT_TAG =~ /^v.*/
    # Запускать на default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# ПУБЛИКАЦИЯ В NPM (только при пуше тега v*)
# =============================================================================

publish-packages:
  <<: *node_template
  stage: publish
  needs:
    - validate
  script:
    - npm ci
    - npm run build

    # Проверка NPM_TOKEN
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "⚠️  NPM_TOKEN не настроен — пропускаем публикацию"
        echo ""
        echo "Для настройки:"
        echo "  1. Создай токен на https://www.npmjs.com/settings/tokens"
        echo "  2. GitLab: Settings → CI/CD → Variables → Add NPM_TOKEN"
        exit 0
      fi

    # Настройка .npmrc для аутентификации
    - echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc

    # Функция для безопасной публикации (пропускает если версия уже опубликована)
    - |
      publish_if_needed() {
        local pkg_path="$1"
        local pkg_name=$(node -p "require('./${pkg_path}/package.json').name")
        local pkg_version=$(node -p "require('./${pkg_path}/package.json').version")

        echo ""
        echo "📦 Проверяю ${pkg_name}@${pkg_version}..."

        # Проверяем, опубликована ли уже эта версия
        if npm view "${pkg_name}@${pkg_version}" version 2>/dev/null; then
          echo "  ⏭️  Версия ${pkg_version} уже опубликована — пропускаю"
          return 0
        fi

        echo "  📤 Публикую ${pkg_name}@${pkg_version}..."
        cd "${pkg_path}"
        if npm publish --access public; then
          echo "  ✅ ${pkg_name}@${pkg_version} опубликован!"
        else
          echo "  ❌ Ошибка публикации ${pkg_name}"
          return 1
        fi
        cd - > /dev/null
      }

    # Публикация в порядке зависимостей
    - echo "🚀 Начинаю публикацию пакетов..."
    - echo ""

    # 1. Infrastructure (база, без зависимостей)
    - publish_if_needed "packages/framework/infrastructure"

    # 2. CLI (зависит от infrastructure)
    - publish_if_needed "packages/framework/cli"

    # 3. Core (зависит от infrastructure)
    - publish_if_needed "packages/framework/core"

    # 4. Серверы (зависят от всех framework пакетов)
    - publish_if_needed "packages/servers/yandex-tracker"
    - publish_if_needed "packages/servers/yandex-wiki"

    - echo ""
    - echo "🎉 Публикация завершена!"

  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  environment:
    name: npm-registry
    url: https://www.npmjs.com/org/mcp-framework

# =============================================================================
# СБОРКА АРТЕФАКТОВ (только при пуше тега v*)
# =============================================================================

build-mcpb:
  <<: *node_template
  stage: publish
  needs:
    - validate
  script:
    - npm ci
    - npm run build:mcpb
  artifacts:
    paths:
      - "*.mcpb"
      - packages/servers/yandex-tracker/dist/yandex-tracker.bundle.cjs
      - packages/servers/yandex-wiki/dist/yandex-wiki.bundle.cjs
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
